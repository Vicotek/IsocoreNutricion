name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject cache-busting version into index.html
        run: |
          VERSION=$(date +%Y%m%d%H%M%S)
          echo "Nueva versión de caché: ${VERSION}"
          sed -i -E "s#(src=\"[^\"]+\.(js|css))(\?v=[0-9]+)?(\")#\1?v=${VERSION}\4#g" index.html
          echo "--- index.html resultante (líneas con ?v=) ---"
          grep -n "?v=" index.html || echo "Aviso: no se encontró ningún ?v= tras el reemplazo, revisar el patrón sed"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
